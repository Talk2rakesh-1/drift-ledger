[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-ledger"
version = "0.1.0"
description = "Local robust anomaly detection and distribution monitoring for numeric ML inputs"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
drift-ledger = "drift_ledger.__main__:main"

[tool.setuptools.packages.find]
include = ["drift_ledger*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
