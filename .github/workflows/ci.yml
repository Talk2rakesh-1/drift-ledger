name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy drift_ledger
      - run: coverage run --source=drift_ledger -m unittest discover -s tests -v && coverage report --fail-under=85
      - run: bandit -r drift_ledger -ll
      - run: pip-audit -r requirements-dev.txt && pip-audit -r requirements.txt
      - name: Installed CLI smoke test
        run: |
          pip install .
          drift-ledger examples/reference.json examples/reference.json > stable.json
          set +e
          drift-ledger examples/reference.json examples/shifted.json > shifted.json
          status=$?
          set -e
          test "$status" -eq 1
