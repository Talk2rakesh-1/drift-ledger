name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy drift_ledger
      - run: coverage run --source=drift_ledger -m unittest discover -s tests -v && coverage report --fail-under=85
      - run: bandit -r drift_ledger -ll
      - run: pip-audit -r requirements-dev.txt && pip-audit -r requirements.txt
      - name: Installed CLI smoke test
        run: |
          pip install .
          drift-ledger examples/reference.json examples/reference.json > stable.json
          set +e
          drift-ledger examples/reference.json examples/shifted.json > shifted.json
          status=$?
          set -e
          test "$status" -eq 1
